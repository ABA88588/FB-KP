name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate:
    name: pnpm quality gate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @adflow/web exec playwright install chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/playwright
          if-no-files-found: ignore

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: test-results/ui
          if-no-files-found: error

  docker:
    name: Docker build/config validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        shell: bash
        env:
          APP_BASE_URL: http://localhost
          AUTH_SECRET: ci_auth_secret_32_bytes_minimum_value
          DATABASE_URL: postgresql://adflow:ci_postgres_password@postgres:5432/adflow?schema=public
          DEMO_MODE: "true"
          META_OAUTH_REDIRECT_URI: http://localhost/api/meta/oauth/callback
          POSTGRES_PASSWORD: ci_postgres_password
          REDIS_PASSWORD: ci_redis_password
          REDIS_URL: redis://:ci_redis_password@redis:6379/0
          TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          TOKEN_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: |
          set -euo pipefail
          docker compose -f docker-compose.prod.yml config
          docker compose -f docker-compose.prod.yml build
