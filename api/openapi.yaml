openapi: 3.1.0
info:
  title: AdFlow Console Internal API
  version: 1.0.0
  description: |
    Internal browser-to-server API. Meta access tokens never appear in this contract.
servers:
  - url: /api
security:
  - cookieSession: []
paths:
  /health/live:
    get:
      security: []
      operationId: getLiveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      security: []
      operationId: getReadiness
      responses:
        '200':
          description: Dependencies ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/Error'

  /meta/oauth/start:
    post:
      operationId: startMetaOAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, intent]
              properties:
                organizationId: { type: string, format: uuid }
                intent: { type: string, enum: [read, manage] }
                returnTo: { type: string, default: /onboarding/meta }
      responses:
        '200':
          description: OAuth URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [authorizationUrl]
                        properties:
                          authorizationUrl: { type: string, format: uri }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /meta/oauth/callback:
    get:
      security: []
      operationId: completeMetaOAuth
      parameters:
        - in: query
          name: code
          required: false
          schema: { type: string }
        - in: query
          name: state
          required: true
          schema: { type: string }
        - in: query
          name: error
          required: false
          schema: { type: string }
      responses:
        '302': { description: Redirect to fixed onboarding result }
        '400': { $ref: '#/components/responses/Error' }

  /connections:
    get:
      operationId: listConnections
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Connections
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Connection' }
    post:
      operationId: createDemoConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, mode]
              properties:
                organizationId: { type: string, format: uuid }
                mode: { type: string, const: demo }
      responses:
        '201':
          description: Demo connection created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Connection' }
  /connections/{connectionId}:
    delete:
      operationId: disconnectMeta
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '202':
          description: Disconnect scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobEnvelope' }
        '404': { $ref: '#/components/responses/Error' }

  /ad-accounts:
    get:
      operationId: listAdAccounts
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - in: query
          name: connectionId
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Ad accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAdAccountsEnvelope'
  /ad-accounts/{adAccountId}/sync:
    post:
      operationId: startAccountSync
      parameters:
        - $ref: '#/components/parameters/AdAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  items: { type: string, enum: [entities, insights, creatives] }
                  default: [entities, insights]
                since: { type: string, format: date }
                until: { type: string, format: date }
      responses:
        '202':
          description: Sync queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobEnvelope' }

  /entities:
    get:
      operationId: listAdEntities
      parameters:
        - $ref: '#/components/parameters/AdAccountIdQuery'
        - in: query
          name: level
          required: true
          schema: { $ref: '#/components/schemas/EntityLevel' }
        - in: query
          name: search
          schema: { type: string, maxLength: 200 }
        - in: query
          name: status
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - in: query
          name: sort
          schema: { type: string, example: -spend }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: since
          schema: { type: string, format: date }
        - in: query
          name: until
          schema: { type: string, format: date }
      responses:
        '200':
          description: Entity rows with joined metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEntitiesEnvelope'
  /entities/{entityId}:
    get:
      operationId: getAdEntity
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - in: query
          name: level
          required: true
          schema: { $ref: '#/components/schemas/EntityLevel' }
        - in: query
          name: since
          schema: { type: string, format: date }
        - in: query
          name: until
          schema: { type: string, format: date }
      responses:
        '200':
          description: Entity detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/EntityDetail' }
        '404': { $ref: '#/components/responses/Error' }

  /mutations/status:
    post:
      operationId: mutateEntityStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adAccountId, level, entityIds, status, confirmationToken]
              properties:
                adAccountId: { type: string, format: uuid }
                level: { $ref: '#/components/schemas/EntityLevel' }
                entityIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string, format: uuid }
                status: { type: string, enum: [ACTIVE, PAUSED] }
                confirmationToken: { type: string }
      responses:
        '202':
          description: Mutation queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobEnvelope' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /drafts:
    get:
      operationId: listDrafts
      parameters:
        - $ref: '#/components/parameters/AdAccountIdQuery'
        - in: query
          name: kind
          schema: { type: string, enum: [campaign_bundle] }
      responses:
        '200':
          description: Drafts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Draft' }
    post:
      operationId: createDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftInput' }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Draft' }
  /drafts/{draftId}:
    patch:
      operationId: updateDraft
      parameters:
        - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, payload]
              properties:
                version: { type: integer, minimum: 1 }
                payload: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Draft updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Draft' }
        '409': { $ref: '#/components/responses/Error' }
  /drafts/{draftId}/publish:
    post:
      operationId: publishDraft
      parameters:
        - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmationToken]
              properties:
                confirmationToken: { type: string }
      responses:
        '202':
          description: Publish queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobEnvelope' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /insights/query:
    post:
      operationId: queryInsights
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsightsQuery' }
      responses:
        '200':
          description: Synchronous result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InsightsResult' }
        '202':
          description: Large report queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobEnvelope' }
        '422': { $ref: '#/components/responses/Error' }
  /reports/{reportId}:
    get:
      operationId: getReport
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Report state/result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Report' }
  /reports/{reportId}/export:
    post:
      operationId: exportReportCsv
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '202':
          description: Export queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobEnvelope' }

  /jobs/{jobId}:
    get:
      operationId: getJob
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/Error' }

  /saved-views:
    get:
      operationId: listSavedViews
      parameters:
        - $ref: '#/components/parameters/AdAccountIdQuery'
        - in: query
          name: level
          schema: { $ref: '#/components/schemas/EntityLevel' }
      responses:
        '200':
          description: Saved views
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SavedView' }
    post:
      operationId: createSavedView
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedViewInput' }
      responses:
        '201':
          description: Saved view created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SavedView' }

  /audit-logs:
    get:
      operationId: listAuditLogs
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Audit logs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AuditLog' }
                      page: { $ref: '#/components/schemas/CursorPage' }

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: adflow.session
  parameters:
    OrganizationId:
      in: query
      name: organizationId
      required: true
      schema: { type: string, format: uuid }
    ConnectionId:
      in: path
      name: connectionId
      required: true
      schema: { type: string, format: uuid }
    AdAccountId:
      in: path
      name: adAccountId
      required: true
      schema: { type: string, format: uuid }
    AdAccountIdQuery:
      in: query
      name: adAccountId
      required: true
      schema: { type: string, format: uuid }
    EntityId:
      in: path
      name: entityId
      required: true
      schema: { type: string, format: uuid }
    DraftId:
      in: path
      name: draftId
      required: true
      schema: { type: string, format: uuid }
    ReportId:
      in: path
      name: reportId
      required: true
      schema: { type: string, format: uuid }
    JobId:
      in: path
      name: jobId
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    Envelope:
      type: object
      required: [meta]
      properties:
        data: {}
        meta:
          type: object
          required: [requestId]
          properties:
            requestId: { type: string }
            dataSource: { type: string, enum: [LIVE, DEMO, CACHE] }
            freshnessAt: { type: string, format: date-time }
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
            details: { type: object, additionalProperties: true }
        meta:
          type: object
          required: [requestId]
          properties:
            requestId: { type: string }
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, unavailable] }
        checks: { type: object, additionalProperties: true }
    CursorPage:
      type: object
      properties:
        nextCursor: { type: [string, 'null'] }
        hasNext: { type: boolean }
        totalApproximate: { type: [integer, 'null'] }
    EntityLevel:
      type: string
      enum: [campaign, adset, ad]
    Connection:
      type: object
      required: [id, mode, status, scopes, createdAt]
      properties:
        id: { type: string, format: uuid }
        mode: { type: string, enum: [LIVE, DEMO] }
        status: { type: string, enum: [HEALTHY, EXPIRING, EXPIRED, REVOKED, ERROR] }
        metaUserIdMasked: { type: [string, 'null'] }
        scopes:
          type: array
          items: { type: string }
        expiresAt: { type: [string, 'null'], format: date-time }
        lastValidatedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    AdAccount:
      type: object
      required: [id, metaId, name, currency, timezoneName, dataSource]
      properties:
        id: { type: string, format: uuid }
        metaId: { type: string, pattern: '^act_[0-9]+$' }
        name: { type: string }
        currency: { type: string }
        timezoneName: { type: string }
        status: { type: string }
        isReadOnly: { type: boolean }
        dataSource: { type: string, enum: [LIVE, DEMO] }
        lastEntitySyncAt: { type: [string, 'null'], format: date-time }
        lastInsightsSyncAt: { type: [string, 'null'], format: date-time }
    PagedAdAccountsEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/AdAccount' }
            page: { $ref: '#/components/schemas/CursorPage' }
    EntityRow:
      type: object
      required: [id, metaId, level, name, configuredStatus, effectiveStatus, metrics]
      properties:
        id: { type: string, format: uuid }
        metaId: { type: string }
        level: { $ref: '#/components/schemas/EntityLevel' }
        name: { type: string }
        parentId: { type: [string, 'null'], format: uuid }
        configuredStatus: { type: string }
        effectiveStatus: { type: string }
        budgetMinor: { type: [string, 'null'] }
        currency: { type: string }
        metrics: { $ref: '#/components/schemas/Metrics' }
        updatedAtSource: { type: [string, 'null'], format: date-time }
        pendingMutation: { type: boolean }
    PagedEntitiesEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/EntityRow' }
            page: { $ref: '#/components/schemas/CursorPage' }
    Metrics:
      type: object
      properties:
        spend: { type: [string, 'null'] }
        impressions: { type: [string, 'null'] }
        reach: { type: [string, 'null'] }
        clicks: { type: [string, 'null'] }
        linkClicks: { type: [string, 'null'] }
        conversions: { type: [string, 'null'] }
        conversionValue: { type: [string, 'null'] }
        ctr: { type: [string, 'null'] }
        cpc: { type: [string, 'null'] }
        cpm: { type: [string, 'null'] }
        cpa: { type: [string, 'null'] }
        roas: { type: [string, 'null'] }
    EntityDetail:
      allOf:
        - $ref: '#/components/schemas/EntityRow'
        - type: object
          properties:
            settings: { type: object, additionalProperties: true }
            trend:
              type: array
              items:
                type: object
                required: [date, metrics]
                properties:
                  date: { type: string, format: date }
                  metrics: { $ref: '#/components/schemas/Metrics' }
            activity:
              type: array
              items: { $ref: '#/components/schemas/AuditLog' }
    DraftInput:
      type: object
      required: [adAccountId, kind, payload]
      properties:
        adAccountId: { type: string, format: uuid }
        kind: { type: string, const: campaign_bundle }
        name: { type: string, maxLength: 200 }
        payload: { type: object, additionalProperties: true }
    Draft:
      allOf:
        - $ref: '#/components/schemas/DraftInput'
        - type: object
          required: [id, version, status, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
            status: { type: string, enum: [DRAFT, PUBLISHING, PUBLISHED, FAILED] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    InsightsQuery:
      type: object
      required: [adAccountId, level, since, until, timeIncrement, fields]
      properties:
        adAccountId: { type: string, format: uuid }
        level: { $ref: '#/components/schemas/EntityLevel' }
        since: { type: string, format: date }
        until: { type: string, format: date }
        timeIncrement:
          oneOf:
            - type: integer
              enum: [1, 7]
            - type: string
              enum: [monthly, all_days]
        fields:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        breakdowns:
          type: array
          uniqueItems: true
          items: { type: string }
        actionBreakdowns:
          type: array
          uniqueItems: true
          items: { type: string }
        filters:
          type: array
          items:
            type: object
            required: [field, operator, value]
            properties:
              field: { type: string }
              operator: { type: string }
              value: {}
        attributionWindows:
          type: array
          items: { type: string }
    InsightsResult:
      type: object
      required: [columns, rows]
      properties:
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items: { type: object, additionalProperties: true }
        totals: { type: object, additionalProperties: true }
    Report:
      type: object
      required: [id, status, progress, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED, RUNNING, INGESTING, SUCCEEDED, FAILED] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        result: { $ref: '#/components/schemas/InsightsResult' }
        error: { $ref: '#/components/schemas/ErrorEnvelope' }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    Job:
      type: object
      required: [id, type, status, progress, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, PARTIAL, FAILED, CANCELLED, UNKNOWN_OUTCOME] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        summary: { type: object, additionalProperties: true }
        error: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    JobEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Job' }
    SavedViewInput:
      type: object
      required: [adAccountId, level, name, config]
      properties:
        adAccountId: { type: string, format: uuid }
        level: { $ref: '#/components/schemas/EntityLevel' }
        name: { type: string, minLength: 1, maxLength: 80 }
        config: { type: object, additionalProperties: true }
        isDefault: { type: boolean, default: false }
    SavedView:
      allOf:
        - $ref: '#/components/schemas/SavedViewInput'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    AuditLog:
      type: object
      required: [id, action, resourceType, outcome, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorName: { type: [string, 'null'] }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: [string, 'null'] }
        metaIdMasked: { type: [string, 'null'] }
        outcome: { type: string }
        requestId: { type: string }
        summary: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
